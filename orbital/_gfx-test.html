<style>html,body{margin:0;height:100%}#stage{position:fixed;inset:0;background:#000}</style></head>
<body><div id="stage" class="stage"></div>
<script type="module">
import { createStage } from '../shared/scene.js';
import * as S from './space.js';
import { BODIES } from './bodies.js';
const stageEl = document.getElementById('stage');
let stage = null; let stuff = [];
window.setup = (o = {}) => {
  if (stage) stage.dispose();
  stageEl.replaceChildren();
  stage = createStage(stageEl);
  S.configureSpaceRenderer(stage); S.setupSpaceLighting(stage);
  const body = BODIES[o.body || 'earth'];
  const k = body.radius / (o.radiusUnits || 30);
  const stars = S.createStars(260); stage.scene.add(stars);
  const b = S.createBody(body, k, { minRadiusUnits: o.minR || 0, graticule: !!o.grat }); stage.scene.add(b.group);
  window.body = b;
  if (o.orbit) {
    const R = (body.radius + o.orbit) ; const pts = []; for (let i = 0; i < 180; i++) { const a = i / 180 * Math.PI * 2; pts.push([R * Math.cos(a), R * Math.sin(a)]); }
    const p = S.createPath(pts, k, { closed: true, color: S.spaceTheme().ink, opacity: 0.9 }); stage.scene.add(p.object);
    const p2 = S.createPath(pts.map(([x, y]) => [x * 1.6, y * 1.0]), k, { closed: true, dashed: true, opacity: 0.8 }); stage.scene.add(p2.object);
    const c = S.createCraft({ trail: 140 }); stage.scene.add(c.object);
    c.object.traverse((x) => { if (x.material) x.material.depthTest = false; });
    const m = S.createMarker('Lowest point', { side: 'right' }); stage.scene.add(m.object);
    const ar = S.createArrow({ radius: 0.4 }); stage.scene.add(ar.object);
    const a0 = (o.phase ?? 0.8);
    for (let i = 0; i <= 40; i++) { const a = a0 - 1.6 + i / 40 * 1.6; c.setPosition([R * Math.cos(a), R * Math.sin(a)], k); }
    c.setHeading([-Math.sin(a0), Math.cos(a0)]);
    m.setPosition([R * Math.cos(2.5), R * Math.sin(2.5)], k);
    ar.set([R * Math.cos(a0), R * Math.sin(a0)], [-Math.sin(a0), Math.cos(a0)], k, 10);
    window.craft = c;
  }
  if (o.craftOnly) {
    const c = S.createCraft({ trail: 20, size: o.size || 13 }); stage.scene.add(c.object); c.setPosition([0, 0], 1); c.setHeading([1, 0.3]); window.craft = c;
  }
  S.frameSpace(stage, o.extent || 60, { elevationDeg: o.el ?? 55, azimuthDeg: o.az ?? 10 });
  if (o.cam) { stage.camera.position.set(...o.cam); stage.controls.target.set(...(o.target || [0, 0, 0])); stage.controls.update(); }
  if (o.spin != null) b.group.userData.spin(o.spin);

  window.stage = stage;
