<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gfx test</title>
<link rel="stylesheet" href="../shared/style.css">
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"../vendor/OrbitControls.js"}}</script>
<style>
html,body{margin:0;height:100%;background:var(--stage-bg)}
.stage{position:absolute;inset:0}
.stage{background-size:100% 100%;background-image:
 radial-gradient(ellipse 72% 62% at 50% 44%, rgba(255,255,255,.72) 0%, rgba(255,255,255,0) 74%),
 linear-gradient(to bottom, rgba(40,52,70,0) 55%, rgba(40,52,70,.065) 100%),
 radial-gradient(ellipse 125% 105% at 50% 48%, rgba(40,52,70,0) 58%, rgba(40,52,70,.11) 100%);}
@media (prefers-color-scheme: dark){.stage{background-image:
 radial-gradient(ellipse 72% 62% at 50% 44%, rgba(255,255,255,.075) 0%, rgba(255,255,255,0) 74%),
 linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,.16) 100%),
 radial-gradient(ellipse 125% 105% at 50% 48%, rgba(0,0,0,0) 56%, rgba(0,0,0,.32) 100%);}}
</style></head>
<body><div id="stage" class="stage"></div>
<script type="module">
import { createStage } from '../shared/scene.js';
import { createViewer, configureRenderer } from './viewer.js';
import { MOLECULES } from './molecule-data.js';
import { CRYSTALS } from './crystal-data.js';
import { buildBlock, cellVectors, planePolygon } from './lattice.js';
import { ELEMENTS } from './elements.js';

const q = new URLSearchParams(location.search);
const id = q.get('case') || 'water';
const style = q.get('style') || 'ball-stick';
const extras = q.get('extras') === '1';
const n = +(q.get('n') || 3);
const stage = createStage(document.getElementById('stage'), { fov: 25 });
configureRenderer(stage);
const viewer = createViewer(stage, {});
window.__v = viewer; window.__stage = stage;

function packed(c, structure) {
  const first = c.basis[0].el;
  if (c.group === 'metal' && ELEMENTS[first] && ELEMENTS[first].metallic) {
    const nearest = c.expect.shells ? c.expect.shells[0].d : c.expect.nearest;
    return { spaceRadius: 'metallic', radiusScale: nearest / 2 / ELEMENTS[first].metallic };
  }
  let scale = Infinity;
  for (const b of structure.bonds) {
    const A = structure.atoms[b.a], B = structure.atoms[b.b];
    const d = Math.hypot(A.pos[0]-B.pos[0], A.pos[1]-B.pos[1], A.pos[2]-B.pos[2]);
    scale = Math.min(scale, d / ((ELEMENTS[A.el].covalent||1)+(ELEMENTS[B.el].covalent||1)));
  }
  if (!Number.isFinite(scale)) scale = 1;
  return { spaceRadius: 'covalent', radiusScale: Math.max(0.5, scale) };
}

const t0 = performance.now();
let structure; let opts = { style };
if (MOLECULES[id]) {
  structure = MOLECULES[id];
} else {
  const c = CRYSTALS[id];
  structure = buildBlock(c, { nx: n, ny: n, nz: n });
  structure.atoms.forEach((a) => { if (a.tag === 'boundary') a._t = 'boundary'; });
  opts = { style, fade: extras ? { boundary: 0.3 } : {}, ...(style === 'space-fill' ? packed(c, structure) : {}) };
  if (q.get('bigfade')) opts.fade = { boundary: 0.3 };
  window.__c = c;
}
viewer.setStructure(structure, opts);
const buildMs = performance.now() - t0;
viewer.frame();
if (structure.cell) viewer.setCell(structure.cell);
if (extras) {
  if (CRYSTALS[id]) {
    const unit = cellVectors(CRYSTALS[id].params);
    const poly = planePolygon(unit, [1,1,1], 1);
    viewer.setPlanes([{ points: poly, label: '(111)' }]);
    viewer.setArrows([{ from: [0, -1.5, 0], to: [4, -1.5, 0], label: 'a' }]);
    const mid = Math.floor(structure.atoms.length / 2);
    viewer.highlight([mid, mid + 1, mid + 2], {});
    viewer.measure.add(0); viewer.measure.add(1);
  } else {
    const m = structure;
    viewer.setArrows([{ from: [0, 0, 0], to: [0, 1.6, 0], label: 'dipole' }]);
    viewer.highlight([0], {});
    viewer.measure.add(0); viewer.measure.add(1); if (m.atoms.length > 2) viewer.measure.add(2);
    viewer.setLabels(true);
  }
}
if (q.get('spin')) viewer.setSpin(true);
stage.requestRender();
window.__buildMs = buildMs;
setTimeout(() => { window.__ready = true; }, 600);
</script></body></html>
