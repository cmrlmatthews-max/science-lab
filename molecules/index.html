<style id="molecules-style">
  /* Structure view: no square-grid backdrop behind the 3D canvas (layout glue only, existing tokens). */
  /* Soft studio vignette and floor gradient: the model sits in a space, not on graph paper (light and dark). */
  .stage {
    background-size: 100% 100%;
    background-image:
      radial-gradient(ellipse 72% 62% at 50% 44%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0) 74%),
      linear-gradient(to bottom, rgba(40, 52, 70, 0) 55%, rgba(40, 52, 70, 0.065) 100%),
      radial-gradient(ellipse 125% 105% at 50% 48%, rgba(40, 52, 70, 0) 58%, rgba(40, 52, 70, 0.11) 100%);
  }
  @media (prefers-color-scheme: dark) {
    .stage {
      background-image:
        radial-gradient(ellipse 72% 62% at 50% 44%, rgba(255, 255, 255, 0.075) 0%, rgba(255, 255, 255, 0) 74%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.16) 100%),
        radial-gradient(ellipse 125% 105% at 50% 48%, rgba(0, 0, 0, 0) 56%, rgba(0, 0, 0, 0.32) 100%);
    }
  }
  .app-title { white-space: nowrap; }
  /* The bottom panel holds few controls in this module, so the 3D view gets the height. */
  @media (min-width: 900px) { .shell { grid-template-rows: minmax(0, 1fr) clamp(140px, 19vh, 200px); } }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="home-link" href="../index.html" aria-label="Back to Science Lab">Lab</a>
    <h1 class="app-title">Molecules and Crystals</h1>
    <!-- mode tabs are inserted here by main.js -->
  </header>
  <main class="shell">
    <section class="stage-wrap" aria-label="3D view">
      <div id="stage" class="stage"></div>
    </section>
    <div id="summary" class="summary" aria-live="polite"></div>
    <div id="sheet" class="sheet">
      <section class="panel-wrap is-active" data-panel="a"><h2 class="panel-title" id="title-a">Structure</h2><div id="panel-a" class="panel"></div></section>
      <section class="panel-wrap" data-panel="b"><h2 class="panel-title" id="title-b">Measure</h2><div id="panel-b" class="panel"></div></section>
      <section class="panel-wrap" data-panel="c"><h2 class="panel-title" id="title-c">Notes</h2><div id="panel-c" class="panel"></div></section>
    </div>
  </main>
  <noscript>Molecules and Crystals needs JavaScript.</noscript>
</div>
